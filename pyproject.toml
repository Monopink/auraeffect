[project]
name = "auraeffect"
version = "0.1.0"
description = "Local CLI watermark removal pipeline using AviSynth+ and InpaintDelogo."
requires-python = ">=3.11"

[project.scripts]
auraeffect = "auraeffect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
